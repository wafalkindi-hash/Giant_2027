# ═══════════════════════════════════════════════════════
# fly.toml — إعدادات Fly.io للبوابة
# ═══════════════════════════════════════════════════════
app = "giant-portal"
primary_region = "cdg"  # باريس (أقرب لليمن من فرانكفورت)

[build]
  dockerfile = "portal/Dockerfile"

[env]
  PORTAL_ENV = "production"
  PORTAL_HOST = "0.0.0.0"
  PORTAL_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "giant_data"
  destination = "/app/data"
